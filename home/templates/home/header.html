{% load static %}

<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md shadow-md">
  <nav class="container mx-auto px-6">
    <div class="flex items-center justify-between py-4">
      <!-- Logo/Brand -->
      <a href="{% url 'home.home' %}" class="flex items-center gap-3 group">
        <picture>
            <source srcset="{% static 'images/optimized/profile/profile-pic.jpg.webp' %}" type="image/webp">
            <img src="{% static 'images/optimized/profile/profile-pic.jpg' %}" 
                 alt="Gero Zayas" 
                 class="w-10 h-10 rounded-full object-cover border-2 border-persian_green"
                 loading="lazy" 
                 decoding="async"
                 width="40" 
                 height="40">
          </picture>
        <span class="text-xl font-bold text-charcoal group-hover:text-persian_green transition-colors">
          Gero Zayas
        </span>
      </a>
      
      <!-- Desktop Navigation -->
      <ul class="hidden md:flex items-center gap-8">
        <li>
          <a 
            href="{% url 'home.home' %}" 
            class="text-charcoal-700 hover:text-persian_green font-medium transition-colors relative group"
          >
            Home
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-persian_green group-hover:w-full transition-all duration-300"></span>
          </a>
        </li>
        <li>
          <a 
            href="{% url 'portfolio:portfolio_index' %}" 
            class="text-charcoal-700 hover:text-persian_green font-medium transition-colors relative group"
          >
            Portfolio
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-persian_green group-hover:w-full transition-all duration-300"></span>
          </a>
        </li>
        <li>
          <a 
            href="{% url 'blog_index' %}" 
            class="text-charcoal-700 hover:text-persian_green font-medium transition-colors relative group"
          >
            Blog
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-persian_green group-hover:w-full transition-all duration-300"></span>
          </a>
        </li>
        <li>
          <a 
            href="{% url 'home.about' %}" 
            class="text-charcoal-700 hover:text-persian_green font-medium transition-colors relative group"
          >
            About
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-persian_green group-hover:w-full transition-all duration-300"></span>
          </a>
        </li>
        <li>
          <a 
            href="{% url 'home.contact' %}" 
            class="px-6 py-2 bg-burnt_sienna text-white font-semibold rounded-lg hover:bg-sandy_brown transform hover:-translate-y-0.5 transition-all duration-300 shadow-md hover:shadow-lg"
          >
            Contact
          </a>
        </li>
      </ul>
      
      <!-- Mobile Menu Button -->
      <button 
        id="mobile-menu-button"
        class="md:hidden p-2 rounded-lg hover:bg-saffron-100 transition-colors"
        aria-label="Toggle menu"
      >
        <svg class="w-6 h-6 text-charcoal-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
    
    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="hidden md:hidden pb-4">
      <ul class="flex flex-col gap-2">
        <li>
          <a 
            href="{% url 'home.home' %}" 
            class="block px-4 py-2 text-charcoal-700 hover:bg-saffron-100 hover:text-persian_green rounded-lg transition-colors"
          >
            Home
          </a>
        </li>
        <li>
          <a 
            href="{% url 'portfolio:portfolio_index' %}" 
            class="block px-4 py-2 text-charcoal-700 hover:bg-saffron-100 hover:text-persian_green rounded-lg transition-colors"
          >
            Portfolio
          </a>
        </li>
        <li>
          <a 
            href="{% url 'blog_index' %}" 
            class="block px-4 py-2 text-charcoal-700 hover:bg-saffron-100 hover:text-persian_green rounded-lg transition-colors"
          >
            Blog
          </a>
        </li>
        <li>
          <a 
            href="{% url 'home.about' %}" 
            class="block px-4 py-2 text-charcoal-700 hover:bg-saffron-100 hover:text-persian_green rounded-lg transition-colors"
          >
            About
          </a>
        </li>
        <li>
          <a 
            href="{% url 'home.contact' %}" 
            class="block px-4 py-2 bg-burnt_sienna text-white rounded-lg hover:bg-sandy_brown transition-colors text-center font-semibold"
          >
            Contact
          </a>
        </li>
      </ul>
    </div>
  </nav>
</header>

<script>
  // Mobile menu toggle
  document.getElementById('mobile-menu-button')?.addEventListener('click', function() {
    const menu = document.getElementById('mobile-menu');
    menu.classList.toggle('hidden');
  });
</script>
