{% load static %}

<header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md shadow-md">
  <nav class="container mx-auto px-6">
    <div class="flex items-center justify-between py-4">
      <!-- Logo/Brand -->
      <a href="{% url 'home.home' %}" class="flex items-center gap-3 group">
        <img 
          src="{% static 'images/profile-pic.png' %}" 
          alt="Gero Zayas" 
          class="w-12 h-12 rounded-full ring-2 ring-primary/20 group-hover:ring-primary/50 transition-all duration-300"
        >
        <span class="text-xl font-bold text-gray-900 group-hover:text-primary transition-colors">
          Gero Zayas
        </span>
      </a>
      
      <!-- Desktop Navigation -->
      <ul class="hidden md:flex items-center gap-8">
        <li>
          <a 
            href="{% url 'home.home' %}" 
            class="text-gray-700 hover:text-primary font-medium transition-colors relative group"
          >
            Home
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-primary group-hover:w-full transition-all duration-300"></span>
          </a>
        </li>
        <li>
          <a 
            href="{% url 'portfolio:portfolio_index' %}" 
            class="text-gray-700 hover:text-primary font-medium transition-colors relative group"
          >
            Portfolio
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-primary group-hover:w-full transition-all duration-300"></span>
          </a>
        </li>
        <li>
          <a 
            href="{% url 'blog_index' %}" 
            class="text-gray-700 hover:text-primary font-medium transition-colors relative group"
          >
            Blog
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-primary group-hover:w-full transition-all duration-300"></span>
          </a>
        </li>
        <li>
          <a 
            href="{% url 'home.about' %}" 
            class="text-gray-700 hover:text-primary font-medium transition-colors relative group"
          >
            About
            <span class="absolute bottom-0 left-0 w-0 h-0.5 bg-primary group-hover:w-full transition-all duration-300"></span>
          </a>
        </li>
        <li>
          <a 
            href="{% url 'home.contact' %}" 
            class="px-6 py-2 bg-primary text-white font-semibold rounded-lg hover:bg-primary/90 transform hover:-translate-y-0.5 transition-all duration-300 shadow-md hover:shadow-lg"
          >
            Contact
          </a>
        </li>
      </ul>
      
      <!-- Mobile Menu Button -->
      <button 
        id="mobile-menu-button"
        class="md:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors"
        aria-label="Toggle menu"
      >
        <svg class="w-6 h-6 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>
    
    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="hidden md:hidden pb-4">
      <ul class="flex flex-col gap-2">
        <li>
          <a 
            href="{% url 'home.home' %}" 
            class="block px-4 py-2 text-gray-700 hover:bg-gray-100 hover:text-primary rounded-lg transition-colors"
          >
            Home
          </a>
        </li>
        <li>
          <a 
            href="{% url 'portfolio:portfolio_index' %}" 
            class="block px-4 py-2 text-gray-700 hover:bg-gray-100 hover:text-primary rounded-lg transition-colors"
          >
            Portfolio
          </a>
        </li>
        <li>
          <a 
            href="{% url 'blog_index' %}" 
            class="block px-4 py-2 text-gray-700 hover:bg-gray-100 hover:text-primary rounded-lg transition-colors"
          >
            Blog
          </a>
        </li>
        <li>
          <a 
            href="{% url 'home.about' %}" 
            class="block px-4 py-2 text-gray-700 hover:bg-gray-100 hover:text-primary rounded-lg transition-colors"
          >
            About
          </a>
        </li>
        <li>
          <a 
            href="{% url 'home.contact' %}" 
            class="block px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors text-center font-semibold"
          >
            Contact
          </a>
        </li>
      </ul>
    </div>
  </nav>
</header>

<script>
  // Mobile menu toggle
  document.getElementById('mobile-menu-button')?.addEventListener('click', function() {
    const menu = document.getElementById('mobile-menu');
    menu.classList.toggle('hidden');
  });
</script>
